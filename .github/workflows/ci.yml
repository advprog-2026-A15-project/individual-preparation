name: CI

on:
  pull_request:
    branches: [ "main","cicdtirta" ]
  push:
    branches: [ "main","cicdtirta" ]

jobs:
  build-test-lint-sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      # Build + Test + Lint (Checkstyle)
      - name: Build, Test, Lint
        run: ./gradlew clean test check

      # SonarCloud (jalan kalau token tersedia)
      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN_TIRTA != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_TIRTA }}
        run: ./gradlew sonar --info
